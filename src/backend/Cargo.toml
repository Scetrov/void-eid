[package]
name = "void-eid-backend"
version = "0.1.1"
edition = "2021"
rust-version = "1.96.0"
default-run = "void-eid-backend"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = [
    "sqlite",
    "runtime-tokio-native-tls",
    "chrono",
] }
tower-http = { version = "0.7.0", features = ["cors"] }
tower_governor = "0.8.0"
reqwest = { version = "0.13.4", features = ["json", "form", "multipart"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
rand = "0.10.1"
chrono = { version = "0.4.44", features = ["serde"] }
anyhow = "1.0.102"
base64 = "0.22.1"
urlencoding = "2.1.3"

uuid = { version = "1.23.2", features = ["v4", "serde"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
bcs = "0.2.1"
blake2 = "0.10.6"
ed25519-dalek = "3.0.0"
k256 = "0.13.4"
p256 = "0.13.2"
signature = "3.0"
signature2 = { package = "signature", version = "2.2" }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
bcrypt = "0.19.1"
sha2 = "0.11.0"
hex = "0.4.3"
openssl = "0.10.80"
quinn-proto = "0.11.14"
subtle = "2.6.1"

